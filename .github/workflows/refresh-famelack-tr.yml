name: Refresh Famelack Turkey Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate playlist
        run: python scripts/build_famelack_tr.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- FAMELACK_TR.m3u; then
            echo "No playlist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FAMELACK_TR.m3u
          git commit -m "Refresh Famelack Turkey playlist"
          git push
